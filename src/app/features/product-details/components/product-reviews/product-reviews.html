<section class="reviews">

  <div class="section-header">
    <div>
      <span class="eyebrow">Customer Feedback</span>

      <h2>
        Customer Reviews
      </h2>
    </div>

    <button class="write-review" type="button">
      Write a Review
    </button>
  </div>


  <div class="rating-summary">

    <div class="overall-rating">
      <strong>{{ product().rating }}</strong>

      <div>
        <div class="stars">
          ★★★★★
        </div>

        <span>
          Based on customer reviews
        </span>
      </div>
    </div>

  </div>


  <div class="review-list">

    <article class="review">

      <div class="review-top">

        <div>
          <strong>Sarah M.</strong>

          <div class="stars">
            ★★★★★
          </div>
        </div>

        <span class="date">
          Aug 20, 2026
        </span>

      </div>

      <p>
        Great quality and exactly as shown in the pictures.
        I really love the design.
      </p>

    </article>


    <article class="review">

      <div class="review-top">

        <div>
          <strong>Ahmed K.</strong>

          <div class="stars">
            ★★★★☆
          </div>
        </div>

        <span class="date">
          Aug 15, 2026
        </span>

      </div>

      <p>
        The product looks great and the quality is really good.
      </p>

    </article>

  </div>

</section>
