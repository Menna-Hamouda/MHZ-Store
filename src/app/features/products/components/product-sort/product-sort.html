<div class="sort-box">

  <label for="sort">
    Sort by:
  </label>

  <select
    id="sort"
    (change)="onSortChange($event)"
  >

    <option value="featured">
      Featured
    </option>

    <option value="price-low">
      Price: Low to High
    </option>

    <option value="price-high">
      Price: High to Low
    </option>

    <option value="rating">
      Rating
    </option>

    <option value="newest">
      Newest
    </option>

  </select>

</div>
