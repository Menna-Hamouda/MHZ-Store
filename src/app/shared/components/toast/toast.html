@if (message()) {

  <div class="toast">

    <span class="toast-icon">✓</span>

    <span class="toast-message">
      {{ message() }}
    </span>

    <button
      type="button"
      class="toast-close"
      (click)="close()"
      aria-label="Close notification"
    >
      ×
    </button>

  </div>

}
